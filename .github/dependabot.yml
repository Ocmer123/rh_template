version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    # Wait a week before adopting a new release: most malicious or broken
    # versions are yanked within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
