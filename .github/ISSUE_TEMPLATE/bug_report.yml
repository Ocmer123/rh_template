name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0 (Settings > About)"
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Pixel 7a, Android 16"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data first.
